name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify sources and artifact
        run: ./gradlew test build --stacktrace

      - name: Run integration GameTests
        run: ./gradlew runGameTestServer --stacktrace

      - name: Run planner benchmark
        run: ./gradlew plannerBenchmark --stacktrace

      - name: Verify clean tracked output
        run: |
          git diff --check
          test -z "$(git status --porcelain --untracked-files=no)"

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: raishxcore-verification-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            build/libs/*.jar
            build/reports/tests
            build/reports/planner
            run/logs/latest.log
